[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-leads-monitor"
version = "0.1.0"
description = "Automated freelance job monitoring, filtering, LLM evaluation, and Telegram notifications"
authors = [
    {name = "Horizontal42", email = "andrey@horizontal42.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.10.0",
    "aiosqlite>=0.20.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

