# Основная конфигурация системы Freelance Leads Monitor
# Все секреты и токены хранятся исключительно в .env!

storage:
  db_path: "data/jobs.db"

web:
  host: "0.0.0.0"
  port: 8086

polling:
  kwork_interval: 180  # секунды
  fl_interval: 180     # секунды

collectors:
  kwork:
    base_url: "https://kwork.ru"
    category_ids:
      - 11  # Разработка и IT
      - 41  # Скрипты, боты и mini apps
  fl_ru:
    rss_url: "https://www.fl.ru/rss/all.xml"
  freelance_ru:
    base_url: "https://freelance.ru"
  pchel_net:
    base_url: "https://pchel.net"
    usd_rate: 95.0
  remote_job:
    base_url: "https://remote-job.ru"

filter:
  min_budget: 10000
  hot_score_threshold: 7  # Порог скора (1-10) для отправки в Telegram (Tier 1)

  # Черный список стоп-слов (отсев мусора и студенческих работ)
  stop_words:
    - "диплом"
    - "курсов"
    - "реферат"
    - "контрольн"
    - "студент"
    - "лабораторн"
    - "1с"
    - "1c"
    - "битрикс-сайт"
    - "tilda"
    - "тильда"
    - "wordpress"
    - "вордпресс"
    - "верстка"
    - "верстку"
    - "дизайн"
    - "дизайнер"
    - "seo"
    - "сео"
    - "копирайт"
    - "рерайт"
    - "таргет"
    - "smm"
    - "накрутк"
    - "отзыв"
    - "лайк"

  # Белый список ключевых слов (наш профиль и стек)
  keywords:
    - "python"
    - "питон"
    - "парсер"
    - "парсинг"
    - "парсить"
    - "скрейпинг"
    - "скрейпер"
    - "бот"
    - "telegram"
    - "телеграм"
    - "aiogram"
    - "fastapi"
    - "django"
    - "flask"
    - "crm"
    - "битрикс24"
    - "bitrix24"
    - "api"
    - "интеграци"
    - "llm"
    - "ии"
    - "нейросет"
    - "whisper"
    - "автоматизац"
    - "scraping"
    - "selenium"
    - "playwright"
    - "curl_cffi"
    - "opencv"
    - "yolo"
    - "rag"
    - "qdrant"
    - "tauri"
    - "asyncio"
    - "google sheets"
    - "гугл таблиц"

llm:
  provider: "hybrid"  # "hybrid" (Mistral быстрый отсев -> Antigravity глубокий анализ), "antigravity", "mistral"
  antigravity:
    binary: "agy"
    model: "gemini-3.8-flash-medium"
    timeout_seconds: 150.0
  mistral:
    model: "ministral-8b-latest"
    timeout_seconds: 60.0
