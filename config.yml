# Основная конфигурация системы Freelance Leads Monitor
# Все секреты и токены хранятся исключительно в .env!

storage:
  db_path: "data/jobs.db"

web:
  host: "0.0.0.0"
  port: 8086

polling:
  interval_seconds: 180  # базовый интервал цикла опроса (сек)
  vacancies_interval_seconds: 1800  # интервал опроса вакансий (сек, дефолт 30 минут)
  kwork_interval: 180    # секунды
  fl_interval: 180       # секунды
  initial_backfill: true # при холодном старте опрашивать 3-5 страниц

collectors:
  kwork:
    base_url: "https://kwork.ru"
    category_ids:
      - 11  # Разработка и IT (включает подкатегории: боты, скрипты, бэкенд, сервера)
    max_pages: 5  # Глубина пагинации по категории (по 12 проектов на страницу)
    include_all_pages: 3  # Общая лента биржи для выявления кросс-дисциплинарных лидов
  fl_ru:
    rss_url: "https://www.fl.ru/rss/all.xml"
  freelance_ru:
    base_url: "https://freelance.ru"
    categories:
      - 4    # Веб-разработка и IT
      - 724  # ИИ и Нейросети
    normal_pages: 2
    backfill_pages: 4
  pchel_net:
    base_url: "https://pchel.net"
    usd_rate: 95.0
    normal_pages: 1
    backfill_pages: 3
  habr_career:
    rss_url: "https://career.habr.com/vacancies/rss"
    enabled: true
    queries:
      - "python"
      - "ai"
  avito:
    base_url: "https://www.avito.ru"
    enabled: true
    feed_urls: []
    search_queries:
      - "sankt-peterburg/vakansii"
      - "sankt-peterburg/predlozheniya_uslug"
  hh_ru:
    base_url: "https://api.hh.ru"
    enabled: true
    days: 30
    area: null
    work_format: []
    max_pages: 2
    per_page: 50
    queries:
      - 'NAME:(AI OR ИИ) AND NAME:(инженер OR engineer OR разработчик OR developer)'
      - 'NAME:(junior OR джуниор OR стажер OR стажёр OR intern OR middle OR мидл) AND NAME:(AI OR ИИ OR LLM OR ML OR нейросет*)'
      - 'NAME:(ML OR "machine learning" OR "машинное обучение") AND NAME:(инженер OR engineer OR разработчик OR developer OR стажер OR стажёр OR middle OR мидл)'
      - 'NAME:(LLM OR RAG OR GPT OR "AI agent" OR "AI-агент")'
      - 'NAME:(Python OR "AI engineer" OR "AI разработчик")'
      - 'NAME:"computer vision" OR NAME:"компьютерное зрение" OR NAME:"CV"'
      - 'NAME:(промпт-инженер OR "prompt engineer" OR "AI-ассистент")'
      - 'Python AND (LLM OR RAG OR "AI-агент" OR "AI agent" OR Whisper)'
      - 'Python AND (FastAPI OR aiogram OR "Telegram") AND (автоматизац* OR бот*)'
    drop_title: 'senior|сеньор|\blead\b|тимлид|team lead|ведущ|старш|principal|head of|руководител|архитектор|architect'
    junior_title: 'junior|джуниор|\bджун\b|стаж[её]р|стажировк|\bintern\b|\binternship\b|\btrainee\b|начинающ|младш'
    drop_experience:
      - 'От 3 до 6 лет'
      - 'Более 6 лет'
    stop_title_hard:
      - '\bsmm\b'
      - 'копирайт'
      - 'сбор\w* данных'
      - 'разметчик|разметк\w+ данных|ai[- ]?тренер|ai trainer'
    stop_title_soft:
      - 'продаж|\bsales\b|продавец'
      - 'маркетолог|маркетинг|marketing'
      - 'наставник|куратор|тренер|преподав|менторств|\bкурс(?:ы|ов|а|е|у)?\b|школ|обучени\w*\s+(?:нейросет|ии\b|ai\b|персонал|сотрудник)'
      - 'системн\w+ администратор|администриров'
      - 'робот|\brobot'
    engineering_marker: 'инженер|engineer|разработчик|developer|программист|\bml\b|\bllm\b|\brag\b'
    non_it_enabled: true
    non_it_area: 2  # Санкт-Петербург
    non_it_salary: 70000  # Минимальная зарплата прикладных вакансий
    non_it_queries:
      - 'ЧПУ'
      - 'станок ЧПУ'
      - 'модульный ремонт OR "ремонт телефонов" OR "ремонт ноутбуков"'
      - 'постамат OR "сервисный техник"'
      - '"trade-in" OR "входной контроль" OR "тестирование техники"'
      - 'helpdesk OR эникей'

filter:
