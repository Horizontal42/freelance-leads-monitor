llm:
  provider: "hybrid"  # "hybrid" (Mistral первичный анализ -> Antigravity генерация отклика по требованию), "antigravity", "mistral"
  antigravity:
    binary: "agy"
    model: "gemini-3.8-flash-medium"
    effort: "medium"  # Уровень рассуждений: low | medium | high | xhigh | max (пользователь задает сам)
    timeout_seconds: 180.0
  mistral:
    active_model: "ministral-14b-latest"  # Выбор модели: "ministral-14b-latest" или "ministral-8b-latest"
    # Лимиты по моделям (проверено по официальным заголовкам x-ratelimit API Mistral)
    models:
      ministral-8b-latest:
        rpm_limit: 150         # Официальный лимит API: 188 RPM (625k TPM)
        max_concurrency: 4     # Параллельные запросы
        timeout_seconds: 40.0  # Таймаут запроса
        retry_attempts: 3      # Попытки ретрая при 429 / 5xx
        retry_min_wait: 2.0    # Начальная пауза (сек)
        retry_max_wait: 8.0    # Максимальная пауза (сек)
      ministral-14b-latest:
        rpm_limit: 25          # Официальный лимит API: 30 RPM (937.5k TPM)
        max_concurrency: 2     # Параллельные запросы
        timeout_seconds: 60.0  # Таймаут запроса
        retry_attempts: 3      # Попытки ретрая при 429 / 5xx
        retry_min_wait: 2.0    # Начальная пауза (сек)
        retry_max_wait: 10.0   # Максимальная пауза (сек)

prompts:
  developer_profile:
    name: "Андрей Пименов"
    username: "@Horizontal84"
    level: "Junior+ / Middle"
    specialization: "Python Backend, Telegram-боты, B2B-интеграции (Битрикс24, amoCRM, МойСклад), LLM/Whisper, RAG-системы, речевая аналитика, Computer Vision (YOLOv8)"
    min_budget: 10000
    hourly_rate_rub: 750

  projects_dossier:
    - name: "Speech Analytics (Intervesp)"
      stack: "Python 3.12, FastAPI, Celery, Redis, PostgreSQL, WhisperX, pyannote, Qwen 32B, Bitrix24 REST API, Weasyprint, Jinja2"
      highlights: "Детерминированная валидация оценок и цитат на 100% без галлюцинаций LLM, асинхронные очереди Celery с батчингом на GPU, оптимизация системной памяти, накопительные сводные PDF-отчеты O(n), фильтрация автоответчиков"
      use_for: "Транскрибация звонков, речевая аналитика, внешние API-интеграции с Битрикс24/CRM (вебхуки, REST API - не штатная настройка CRM), локальные нейросети (Whisper, Ollama), Celery-пайплайны, генерация PDF-отчетов"
    - name: "Avia_Pars"
      stack: "Python 3.12, asyncio, aiogram 3, SQLite WAL, residential proxy, pytest (208 тестов)"
      highlights: "UX одного экрана screen.py, Circuit Breaker, асинхронные очереди, высокая надежность и отказоустойчивость под нагрузкой"
      use_for: "Telegram-боты любой сложности, асинхронные пайплайны, интеграция внешних API, автоматизация"
    - name: "netsleuth"
      stack: "Python 3.14+, Typer, Rich, httpx, ctypes, Win32 Iphlpapi, 857 тестов"
      highlights: "Пинг и трассировка под Windows без прав администратора через Iphlpapi.dll (IcmpSendEcho2), скоринг VPN, OEM-кодировки Win32"
      use_for: "Системные скрипты, CLI-утилиты, сетевые задачи, ctypes / Win32 API, высокий test coverage"
    - name: "summarum"
      stack: "Tauri 2 (Rust), TypeScript, CodeMirror 6, decimal.js, 259 тестов"
      highlights: "Pratt-парсер естественного языка, точная десятеричная арифметика decimal.js, песочница DataDirGate"
      use_for: "Десктопные приложения Tauri/Rust, парсеры текста и формул, сложная логика"
    - name: "leads-monitor"
      stack: "Python 3.11, API dev.hh.ru, DaData API, LLM, Google Sheets API (gspread), SQLite"
      highlights: "Автоматический поиск вакансий на hh.ru, обогащение контактов через DaData, занесение B2B-лидов в Google Таблицы"
      use_for: "Интеграция с сервисами вакансий, Google Sheets, обогащение контактов DaData, B2B-автоматизация"
    - name: "Sort_YM"
      stack: "Python 3.11+, yandex-music, Ollama, JSON Schema decoding"
      highlights: "Сортировка медиатеки с LLM-анализом текстов через локальные модели, идемпотентность"
      use_for: "Скрипты работы с медиа, структурированный JSON Schema вывод из локальных LLM"
    - name: "Warehouse Master & LaptopTester"
      stack: "Python, PyQt5, ReportLab, WMI, smartctl, Google Sheets API"
      highlights: "Печать этикеток со штрихкодами (PDF 58x40мм), автоматический опрос SMART/CPU/RAM железа ноутбука"
      use_for: "Десктопный GUI на PyQt5, WMI/SMART железа Windows, генерация PDF-этикеток, Google Sheets"
    - name: "RAG-ассистент"
      stack: "Python 3.11+, LangChain, Qdrant, FastAPI, WhisperX, Docker"
      highlights: "Индексация номенклатуры, таблиц и ГОСТов в векторной СУБД Qdrant для отдела продаж 130+ менеджеров"
      use_for: "Корпоративные RAG-системы, умный поиск по документам, векторные базы Qdrant, корпоративные базы знаний"
    - name: "AgroTech CV"
      stack: "Python, YOLOv8, YOLOv11m-cls, ByteTrack, IsolationForest, OpenCV, CUDA, FastAPI, Docker"
      highlights: "Многокамерный RTSP-пайплайн 24/7 с IP-камер, трекинг ByteTrack, биометрия животных EfficientNet-B1, алерты с FSM"
      use_for: "Компьютерное зрение, детекция объектов и аномалий, видеоаналитика с IP-камер / RTSP, локальный CUDA/GPU инференс"

  rules:
    strict_no_em_dash: true
    preview_rule_140_chars: true
    cold_start_strategy: true
    no_ai_cliches: true

  templates:
    analysis_system_prompt: |
      Ты - старший Python-разработчик и ассистент Андрея Пименова (@Horizontal84, Junior+/Middle).
      Твоя задача - объективно оценить заказ с биржи фриланса и сформировать ответ СТРОГО в формате JSON по заданной схеме.

      БЭКГРАУНД РАЗРАБОТЧИКА (БАЗА ПРОЕКТОВ ИЗ ДОСЬЕ):
      {dossier_text}

      ЖЕСТКИЕ ПРАВИЛА:
      1. Запрет длинных тире (em-dash)! Используй только обычные дефисы "-".
      2. Краткая суть задачи (executive_summary): сформулируй ровно в 3-4 емких, плотных предложениях (что именно требуется сделать, специфика реализации/стека, ключевая техническая сложность). Чем меньше лишних слов, тем лучше, но ровно 3-4 предложения.
      3. Оценивай реальные риски (лимиты, блокировки, капчи, WAF, нестабильные API).
      4. Первоначальный расчет сроков по методике PERT: E = (O + 4M + P) / 6, sigma = (P - O) / 6.
      5. Расчет рыночной и рекомендуемой цены (Mistral):
         - ОБЪЕКТИВНАЯ РЫНОЧНАЯ ЦЕНА (market_price): рассчитай чистую объективную рыночную стоимость разработки в рублях ИСКЛЮЧИТЕЛЬНО на основе времени (pure_dev_hours), технической сложности (complexity) и ставки 1000-1500 руб/час. КАТЕГОРИЧЕСКИ НЕ привязывайся к биржевому демпингу заказчика! Для комплексных сервисов, личных кабинетов и платформ ориентируйся на реальную рыночную стоимость создания аналогичных систем (150 000 - 400 000+ ₽), а не на заниженный бюджет заказчика.
         - ТАКТИЧЕСКАЯ РЕКОМЕНДУЕМАЯ ЦЕНА (recommended_price): ставка разработчика в рублях с учетом бюджета заказчика и сложности для победы в отклике без критического демпинга. Для масштабных задач рекомендуй вход через первый этап (аудит, MVP ядра).
         - В поле price_justification четко сравни рыночную цену с бюджетом клиента (демпинг / нормальный бюджет) и обоснуй тактику (например: "Рыночная цена ~25 000 ₽ при 15ч разработки, входная рекомендуемая ставка 20 000 ₽").
         - ОЦЕНКА ПРИВЛЕКАТЕЛЬНОСТИ (score 1-10):
           * Если стек совпадает и бюджет адекватен объему - score 8-10 (hot).
           * СПЕЦИАЛЬНОЕ ПРАВИЛО ДЛЯ ГОТОВЫХ СЕРВИСОВ ИЗ ДОСЬЕ (Речевая аналитика, Telegram-боты, RAG, Парсинг):
             Если у Андрея уже есть готовая кодовая база и проверенное решение (например, речевая аналитика на WhisperX/Qwen, RAG-поиск, готовый каркас бота/парсера), проект ОБЯЗАТЕЛЬНО должен проходить в приоритет (score 7-9, hot/normal), даже если общий бюджет клиента занижен относительно рыночной разработки с нуля!
             В этом случае в risks_and_pitfalls и price_justification явно укажи: "⚠️ Заниженный бюджет за полный объем сервиса, но задача идеально ложится на уже готовый проект из досье. Заходить через первый этап (аудит/пилот) или адаптировать готовую кодовую базу".
           * Если задача масштабная в новой для нас области, а бюджет занижен в 3-5 раз - снижай score до 5-6 (normal).
           * Если копеечный бюджет за гигантский труд без шансов на диалог - score 1-4 (trash).
         - Независимый глубокий расчет рыночной ставки на основе поиска по биржам в интернете производит Antigravity при генерации отклика по требованию.
      6. Поле proposal_text оставь пустым (""), так как отклик генерируется по отдельному требованию пользователя через Antigravity.
      7. Все материалы задачи и файлы уже полностью извлечены и предоставлены во входных данных. Тебе ЗАПРЕЩЕНО переходить по внешним ссылкам, использовать инструменты экспорта страниц или вызывать браузер.

      ФОРМАТ ОТВЕТА (СТРОГО JSON):
      {{
        "take_order": true,
        "score": 8,
        "priority": "hot",
        "executive_summary": "Краткая суть задачи в 3-4 емких предложениях.",
        "market_price": 25000,
        "recommended_price": 20000,
        "price_justification": "Рыночная цена ~25 000 ₽ при 15ч разработки, рекомендуемая ставка 20 000 ₽.",
        "realistic_days": 4.0,
        "matched_project": "Avia_Pars",
        "complexity": 5,
        "pure_dev_hours": 12.0,
        "risks_and_pitfalls": [
          "Лимиты API внешнего сервиса",
          "Необходимость очередей и повторных попыток при высокой нагрузке"
        ],
        "proposal_text": "",
        "pert": {{
          "optimistic_days": 2.0,
          "most_likely_days": 4.0,
          "pessimistic_days": 7.0,
          "expected_days": 4.17,
          "sigma": 0.83
        }}
      }}

    proposal_prompt_template: |
      Ты - старший Python-разработчик и персональный ассистент Андрея Пименова (@Horizontal84, Junior+/Middle).
      Твоя задача:
      1. ПРОВЕСТИ РЫНОЧНУЮ ОЦЕНКУ С ВЕБ-ПОИСКОМ:
